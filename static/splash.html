<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Booting · Shadow Edge Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #07090f;
      --bg-1: #0c1018;
      --bg-2: #131826;
      --line: #1d2333;
      --fg-0: #e6ecff;
      --fg-1: #a4adc7;
      --fg-2: #6c7493;
      --cyan: #22d3ee;
      --cyan-glow: rgba(34, 211, 238, 0.55);
      --violet: #a78bfa;
      --violet-glow: rgba(167, 139, 250, 0.55);
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      background: radial-gradient(ellipse at top, #0e1424 0%, var(--bg-0) 70%);
      color: var(--fg-0);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* === Animated grid backdrop (operations console vibe) === */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(34, 211, 238, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      animation: gridShift 18s linear infinite;
    }

    @keyframes gridShift {
      from { background-position: 0 0, 0 0; }
      to   { background-position: 40px 40px, 40px 40px; }
    }

    /* === Stage layout === */
    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .panel {
      width: min(520px, 100%);
      text-align: center;
    }

    /* === Shield logo === */
    .shield-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 1.75rem auto;
    }

    .shield {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--cyan) 0%, var(--violet) 100%);
      box-shadow:
        0 0 32px var(--cyan-glow),
        0 0 64px var(--violet-glow),
        inset 0 0 24px rgba(255, 255, 255, 0.18);
      color: var(--bg-0);
      font-weight: 800;
      font-size: 2.1rem;
      letter-spacing: -0.04em;
      animation: shieldPulse 2.4s ease-in-out infinite;
    }

    .shield::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      filter: blur(14px);
      opacity: 0.6;
      z-index: -1;
      animation: haloPulse 2.4s ease-in-out infinite;
    }

    @keyframes shieldPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    @keyframes haloPulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%      { opacity: 0.9; transform: scale(1.15); }
    }

    /* Orbiting ring */
    .ring {
      position: absolute;
      inset: -22px;
      border: 1px solid rgba(34, 211, 238, 0.25);
      border-radius: 50%;
      animation: ringSpin 4s linear infinite;
    }
    .ring::before {
      content: '';
      position: absolute;
      top: -3px;
      left: 50%;
      width: 6px;
      height: 6px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyan-glow);
      transform: translateX(-50%);
    }
    .ring.violet {
      inset: -36px;
      border-color: rgba(167, 139, 250, 0.18);
      animation: ringSpin 6s linear infinite reverse;
    }
    .ring.violet::before {
      background: var(--violet);
      box-shadow: 0 0 10px var(--violet-glow);
    }

    @keyframes ringSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* === Brand text === */
    .brand-name {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-sub {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--fg-2);
      margin-bottom: 2.4rem;
    }

    /* === Progress bar === */
    .bar-frame {
      position: relative;
      height: 4px;
      background: var(--bg-2);
      border-radius: 999px;
      overflow: hidden;
      margin: 0 auto 1rem auto;
      width: 100%;
      max-width: 380px;
      border: 1px solid var(--line);
    }

    .bar-fill {
      position: absolute;
      top: 0;
      left: -35%;
      width: 35%;
      height: 100%;
      background: linear-gradient(90deg,
        rgba(34, 211, 238, 0) 0%,
        var(--cyan) 35%,
        var(--violet) 65%,
        rgba(167, 139, 250, 0) 100%);
      box-shadow: 0 0 12px var(--cyan-glow);
      animation: barSlide 1.6s ease-in-out infinite;
    }

    .bar-fill.complete {
      animation: none;
      left: 0;
      width: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      box-shadow: 0 0 18px var(--cyan-glow), 0 0 24px var(--violet-glow);
    }

    @keyframes barSlide {
      0%   { left: -35%; }
      100% { left: 100%; }
    }

    /* === Status log === */
    .status {
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      font-size: 0.82rem;
      color: var(--fg-1);
      letter-spacing: 0.02em;
      margin-top: 1rem;
      min-height: 1.4rem;
      transition: opacity 200ms ease;
    }

    .status .arrow {
      color: var(--cyan);
      margin-right: 0.4rem;
    }

    .status.fade-out { opacity: 0; }

    .status.error {
      color: var(--red);
    }

    .status.error .arrow { color: var(--red); }

    .hint {
      margin-top: 2rem;
      font-size: 0.72rem;
      color: var(--fg-2);
      letter-spacing: 0.04em;
    }

    .hint .mono {
      font-family: 'JetBrains Mono', monospace;
      color: var(--fg-1);
    }

    /* === Boot ticker (subtle, low z) === */
    .ticker {
      position: fixed;
      bottom: 0.9rem;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      color: var(--fg-2);
      opacity: 0.45;
      text-transform: uppercase;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="stage">
    <div class="panel">
      <div class="shield-wrap">
        <div class="ring violet"></div>
        <div class="ring"></div>
        <div class="shield">SE</div>
      </div>

      <div class="brand-name">Shadow Edge</div>
      <div class="brand-sub">Operations Console</div>

      <div class="bar-frame">
        <div class="bar-fill" id="bar"></div>
      </div>

      <div class="status" id="status"><span class="arrow">›</span><span id="status-text">Initializing</span></div>

      <div class="hint">
        Console boots at <span class="mono">localhost:8876</span>
      </div>
    </div>
  </div>

  <div class="ticker">SHADOW EDGE TOOLS · MARKETING OPERATIONS · v0.1</div>

  <script>
    const CONSOLE_ID_URL = 'http://127.0.0.1:8876/console-id';
    const TARGET_URL = 'http://127.0.0.1:8876/today';
    const POLL_MS = 500;
    const TIMEOUT_MS = 90_000;
    const STAGES = [
      'Initializing',
      'Loading dependencies',
      'Starting server',
      'Wiring routes',
      'Verifying Shadow Edge service',
      'Almost there',
    ];

    const statusEl = document.getElementById('status');
    const statusTextEl = document.getElementById('status-text');
    const barEl = document.getElementById('bar');

    let stageIdx = 0;
    const startedAt = Date.now();

    function setStatus(text, opts = {}) {
      statusEl.classList.add('fade-out');
      setTimeout(() => {
        statusTextEl.textContent = text;
        statusEl.classList.remove('fade-out');
        if (opts.error) statusEl.classList.add('error');
        else statusEl.classList.remove('error');
      }, 180);
    }

    // Cycle through stages every 2s until ready
    const cycleId = setInterval(() => {
      stageIdx = (stageIdx + 1) % STAGES.length;
      setStatus(STAGES[stageIdx]);
    }, 2000);

    async function pollHealth() {
      if (Date.now() - startedAt > TIMEOUT_MS) {
        clearInterval(cycleId);
        setStatus("Console didn't start on port 8876 within 90s. Run start-console.bat manually.", { error: true });
        return;
      }
      try {
        const response = await fetch(CONSOLE_ID_URL, { cache: 'no-store' });
        const payload = await response.json();
        if (payload.app !== 'shadow-edge-marketing-ops') {
          throw new Error('different service is using the console port');
        }
        clearInterval(cycleId);
        barEl.classList.add('complete');
        setStatus('Ready. Loading Shadow Edge Ops');
        const target = 'http://127.0.0.1:8876' + (payload.home_path || '/today');
        setTimeout(() => location.replace(target), 380);
      } catch (e) {
        setTimeout(pollHealth, POLL_MS);
      }
    }

    pollHealth();
  </script>
</body>
</html>
